---
name: CI
on: [push]

# The image is an artifact of the tested main commit. The deployment job below
# consumes its immutable sha tag rather than whatever happens to be :latest.
permissions:
  contents: read
  packages: write

jobs:
  # lint:
  #   name: Lint
  #   runs-on: self-hosted
  #   steps:
  #     - uses: actions/checkout@v2
  #     - run: make ci-lint

  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v2
      - name: Run tests
        run: make ci-test

  build-immutable:
    runs-on: ubuntu-22.04
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable Docker image
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image_tag="ghcr.io/venmail/postal:sha-${DEPLOY_SHA}"
          version="$(git describe --tags 2>/dev/null || true)"
          version="${version:-0.0.0-dev}"
          DOCKER_BUILDKIT=1 docker build --build-arg "VERSION=${version}" -t "$image_tag" .
          docker push "$image_tag"

  authorize-web-api-deploy:
    name: Authorize a reviewed web-only Core deployment
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    outputs:
      approved: ${{ steps.authorization.outputs.approved }}
    steps:
      - uses: actions/checkout@v2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - id: authorization
        name: Require explicit web-only deployment authorization
        run: |
          set -euo pipefail
          # Core has SMTP, worker, requeuer, and cron services. This workflow
          # replaces only web, so no arbitrary main push may silently create
          # mixed-version services. A reviewed merge commit must explicitly
          # carry this exact trailer for an API-only rollout.
          if git log -1 --format=%B | grep -Fxq 'Core-Web-Only-Deploy: approved'; then
            echo 'approved=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Web-only deployment not authorized for this Core commit.'
            echo 'approved=false' >> "$GITHUB_OUTPUT"
          fi

  deploy-web:
    name: Deploy tested Core API image
    runs-on: ubuntu-22.04
    needs: [build-immutable, authorize-web-api-deploy]
    if: github.ref == 'refs/heads/main' && needs.authorize-web-api-deploy.outputs.approved == 'true'
    # Deployment retags a shared local :latest image on the host. Serialize
    # only this critical section so two main pushes cannot interleave their
    # retag/recreate operations and leave an older tested SHA running.
    concurrency:
      group: core-production-web-deploy
      cancel-in-progress: false
    # Only Postal's HTTP/API service is replaced. SMTP, workers, and every
    # Mailer container remain untouched; the DKIM/server API contracts are
    # served by this one process.
    steps:
      - name: Confirm this tested commit is still the current main head
        id: current-main
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_main_sha="$(curl --fail --retry 3 --retry-all-errors \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/heads/main" \
            | jq -er '.object.sha')"
          if [ "$current_main_sha" = "$DEPLOY_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale Core deployment ${DEPLOY_SHA}; main is already ${current_main_sha}."
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy immutable Core API image
        if: steps.current-main.outputs.deploy == 'true'
        uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 # v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SSH_HOST_LIVE }}
          port: ${{ secrets.SSH_PORT_LIVE }}
          username: ${{ secrets.SSH_USERNAME_LIVE }}
          key: ${{ secrets.SSH_PRIVATE_KEY_LIVE }}
          # Verified using a read-only Paramiko production inspection. Pin the
          # ECDSA host key negotiated by the Go SSH client used by this action.
          fingerprint: 'SHA256:yIYa/c7FcIhzqf+STrzs7+sxzv2ZOt/nPCJy1JXvfHU'
          envs: DEPLOY_SHA
          command_timeout: 30m
          script: |
            set -euo pipefail

            case "${DEPLOY_SHA:-}" in
              *[!0-9a-f]* | '')
                echo 'The CI event did not provide a valid immutable commit SHA' >&2
                exit 1
                ;;
            esac
            if [ "${#DEPLOY_SHA}" -ne 40 ]; then
              echo 'The CI event did not provide a full immutable commit SHA' >&2
              exit 1
            fi

            compose_file=/opt/venmail/install/docker-compose.yml
            image_repo=ghcr.io/venmail/postal
            image_tag="${image_repo}:sha-${DEPLOY_SHA}"
            live_tag="${image_repo}:latest"

            test -f "$compose_file"
            docker pull "$image_tag"
            expected_image_id="$(docker image inspect "$image_tag" --format '{{.Id}}')"
            test -n "$expected_image_id"

            # The production compose file intentionally references :latest.
            # Serialize host-side retag/migrate/recreate work as well as the
            # GitHub job: an operator rerun or another SSH path must not
            # interleave a mutable :latest tag with this release.
            lock_dir="${HOME}/.cache"
            mkdir -p "$lock_dir"
            (
              if ! flock -w 1800 9; then
                echo 'Timed out waiting for the Core web deployment lock.' >&2
                exit 1
              fi

              # Retag the already-pulled immutable image locally, then replace
              # only the API service without touching mailer, SMTP, or workers.
              docker tag "$image_tag" "$live_tag"
              # The immutable-binding column is an additive Core migration.
              # The production compose project has no separate runner service,
              # so run it in an ephemeral instance of the mounted web service
              # before the API process reads the new column.
              docker compose -f "$compose_file" run --rm --no-deps web \
                sh -lc 'RAILS_ENV=production bin/rails db:migrate'
              docker compose -f "$compose_file" up -d --no-deps --no-build web

              for attempt in $(seq 1 30); do
                running="$(docker inspect --format '{{.State.Running}}' install-web-1 2>/dev/null || true)"
                actual_image_id="$(docker inspect --format '{{.Image}}' install-web-1 2>/dev/null || true)"
                if [ "$running" = true ] && [ "$actual_image_id" = "$expected_image_id" ]; then
                  echo "Deployed immutable Core API image for ${DEPLOY_SHA}."
                  exit 0
                fi
                sleep 2
              done

              echo 'Core API container did not reach the expected running image; deployment requires operator review.' >&2
              exit 1
            ) 9>"$lock_dir/venmail-core-web-deploy.lock"

      - name: Log in to the Container registry for promotion
        if: steps.current-main.outputs.deploy == 'true'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote the deployed immutable image as registry latest
        if: steps.current-main.outputs.deploy == 'true'
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          immutable="ghcr.io/venmail/postal:sha-${DEPLOY_SHA}"
          docker pull "$immutable"
          docker tag "$immutable" ghcr.io/venmail/postal:latest
          docker push ghcr.io/venmail/postal:latest

  build-release:
    runs-on: ubuntu-22.04
    needs: [test]
    if: contains(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v2
        with:
          fetch-depth: 0
      - name: Log in to the Container registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable release-tag image
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          image_tag="ghcr.io/venmail/postal:${RELEASE_TAG}"
          DOCKER_BUILDKIT=1 docker build --build-arg "VERSION=${RELEASE_TAG}" -t "$image_tag" .
          docker push "$image_tag"
